<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Academia Calendar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calendar-box">
    <div class="header">
        <h1 id="monthYear"></h1>
    </div>

    <div class="weekdays">
        <div>Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>
    </div>

    <div id="calendarDays" class="days-grid"></div>

    <div class="events-section">
        <h2>Upcoming</h2>
        <ul id="eventsList">
            <li>No events loaded</li>
        </ul>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
